---
- name: Install required system packages
  ansible.builtin.package:
    name:
      - fuse3
    state: present

# The distro repositories ship an old mergerfs (Debian 13: 2.40.2), while
# upstream recommends installing its own packages. Pin the version so an
# upgrade is always an explicit, reviewable change.
- name: Check the installed mergerfs version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Version}
      - mergerfs
  register: mergerfs_installed_version_output
  changed_when: false
  failed_when: false
  check_mode: false

- name: Determine whether mergerfs must be installed
  ansible.builtin.set_fact:
    mergerfs_needs_install: >-
      {{ mergerfs_installed_version_output.rc != 0 or
      mergerfs_installed_version_output.stdout != mergerfs_version }}

- name: Install mergerfs {{ mergerfs_version }}
  block:
    - name: Download mergerfs package {{ mergerfs_version }}
      ansible.builtin.get_url:
        url: "{{ mergerfs_deb_url }}"
        dest: "{{ mergerfs_deb_tmp_path }}"
        checksum: "{{ mergerfs_deb_checksum | ternary(mergerfs_deb_checksum, omit) }}"
        mode: "0644"
      # The apt module opens the .deb even in check mode, so it must exist.
      check_mode: false
      when: mergerfs_needs_install | bool

    - name: Install mergerfs {{ mergerfs_version }}
      ansible.builtin.apt:
        deb: "{{ mergerfs_deb_tmp_path }}"
      when: mergerfs_needs_install | bool
  always:
    - name: Remove the temporary mergerfs package
      ansible.builtin.file:
        path: "{{ mergerfs_deb_tmp_path }}"
        state: absent

- name: Install the uncaching script
  ansible.builtin.template:
    src: mergerfs-uncache.j2
    dest: /usr/local/bin/mergerfs-uncache
    mode: "0775"

- name: Move data from cache drive to slow pool as it gets full
  ansible.builtin.cron:
    name: uncache the mergerfs pool
    minute: "0"
    hour: "7"
    weekday: 1-6
    job: >
      /usr/bin/flock -n {{ storage_maintenance_lock_file }} /bin/sh -c
      '/usr/local/sbin/storage-preflight --source {{ cache_root }} --healthchecks-url
      https://healthchecks.{{ host_local }}/ping/a7a66ee2-eed8-4dfa-bfa1-b6217d472c02 &&
      /usr/local/bin/mergerfs-uncache -s {{ cache_root }} -d {{ mergerfs_root }}_slow -t 75 --min-age-hours 24
      --exclude {{ cache_root }}/docker-volumes-cache {{ cache_root }}/Downloads
      --healthchecks-url https://healthchecks.{{ host_local }}/ping/a7a66ee2-eed8-4dfa-bfa1-b6217d472c02'
