---
- name: Create the necessary Speedtest Tracker database
  file:
    path: "{{ docker_dir }}/{{ speedtest_tracker_container_name }}"
    state: directory
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0755"

- name: Create docker network
  ansible.builtin.include_tasks:
    file: network.yml

- name: Make sure that speedtest_tracker-mariadb container is created and running
  community.docker.docker_container:
    name: "{{ speedtest_tracker_container_name }}-db"
    image: linuxserver/mariadb
    pull: true
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
      MYSQL_DATABASE: speedtest
      MYSQL_USER: "{{ mysql_user }}"
      MYSQL_PASSWORD: "{{ mysql_password }}"
    networks:
      - name: "{{ speedtest_tracker_network_name }}"
    state: started
    restart_policy: unless-stopped
    volumes:
      - "{{ docker_dir }}/{{ speedtest_tracker_container_name }}/data:/config"

- name: Make sure that Speedtest tracker container is created and running
  community.docker.docker_container:
    name: "{{ speedtest_tracker_container_name }}"
    image: lscr.io/linuxserver/speedtest-tracker:latest
    pull: true
    env:
      PUID: "{{ guid }}"
      PGID: "{{ guid }}"
      TZ: "{{ timezone }}"
      APP_KEY: "{{ speedtest_tracker_app_key }}"
      APP_URL: "{{ speedtest_tracker_dashboard_url }}"
      APP_TIMEZONE: "{{ timezone }}"
      DB_CONNECTION: mysql
      DB_HOST: "{{ speedtest_tracker_container_name }}-db"
      DB_DATABASE: speedtest
      DB_USERNAME: "{{ mysql_user }}"
      DB_PASSWORD: "{{ mysql_password }}"
      DISPLAY_TIMEZONE: "{{ timezone }}"
      # The preflight must not depend on DNS: if ping fails, Speedtest
      # Tracker falls back to an HTTP GET of SPEEDTEST_EXTERNAL_IP_URL.
      # The IP literal avoids container DNS/Pi-hole flakiness, and
      # /cdn-cgi/trace returns 200 directly (no redirect). `skip_ips` is
      # unset here, so the external-IP value is not consumed; if it is
      # ever enabled, point this back at a real IP-echo service.
      SPEEDTEST_INTERNET_CHECK_HOSTNAME: "1.1.1.1"
      SPEEDTEST_EXTERNAL_IP_URL: "https://1.1.1.1/cdn-cgi/trace"
      # Ookla rate-limits the CLI to roughly one successful run per 30
      # minutes per public IP ("Limit reached: Too many requests
      # received"). Speedtest Tracker only parses JSON error messages, so
      # that plain-text limit shows up as the generic "unexpected error"
      # and 2/3 of a 10-minute schedule fail. Keep this at 30 minutes.
      # See https://github.com/alexjustesen/speedtest-tracker/issues/2914
      SPEEDTEST_SCHEDULE: "0,30 * * * *"
      PRUNE_RESULTS_OLDER_THAN: "30"
    networks:
      - name: "{{ speedtest_tracker_network_name }}"
    links:
      - "{{ speedtest_tracker_container_name }}-db"
    state: started
    restart_policy: unless-stopped
    labels:
      swag.uptime-kuma.enabled: "true"
      swag.uptime-kuma.monitor.name: "{{ speedtest_tracker_dashboard_name }}"
      swag.uptime-kuma.monitor.url: "{{ speedtest_tracker_dashboard_url }}"
      swag.uptime-kuma.monitor.maxretries: "2"

- name: Install the SWAG config files
  template:
    src: "speedtest.subdomain.conf.j2"
    dest: "{{ docker_dir }}/swag/nginx/proxy-confs/speedtest.subdomain.conf"
    owner: "{{ guid }}"
    group: "{{ guid }}"
    mode: "0644"

- name: Setup backup cron job
  ansible.builtin.include_tasks: tasks/backup_service.yml
  vars:
    service_name: "{{ speedtest_tracker_container_name }}"
    cron_schedule: "0 5 * * *"
    backup_cli_args:
      source_paths: "{{ docker_dir }}/{{ speedtest_tracker_container_name }}"
      destination_path: "{{ mergerfs_root }}/docker-volumes-backup"
      container_names_str: "{{ speedtest_tracker_container_name }}-db {{ speedtest_tracker_container_name }}"
