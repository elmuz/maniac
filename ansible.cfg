[defaults]
inventory = ./hosts
interpreter_python = /usr/bin/python3
timeout = 30
# Vault password for the `iac` id comes from a GPG-encrypted blob through the
# secret-free wrapper in scripts/vault-iac-pass (S-03). No --vault-id on the CLI.
vault_identity_list = iac@/usr/local/bin/vault-iac-pass

[connection]
pipelining = True
